name: Expand Fluxquint™ source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand validated Fluxquint™ build
        run: |
          cat .bootstrap/part-* | tr -d '\n' | base64 -d > /tmp/fluxquint-source.tar.gz
          tar -xzf /tmp/fluxquint-source.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Publish expanded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Fluxquint™ build'
          git push
