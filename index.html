<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Fluxquint™ is a deterministic kinetic logic strategy game. Aim, fuse, complete the five and control the shift." />
    <meta property="og:title" content="Fluxquint™" />
    <meta property="og:description" content="Aim. Fuse. Complete the five. Control the shift." />
    <meta property="og:image" content="./public/og.svg" />
    <link rel="icon" href="./public/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css?v=1.1.1" />
    <title>Fluxquint™ — Kinetic Logic Strategy</title>
    <style>
      :root { color-scheme: dark; background: #070b14; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 20%, #17203b 0%, #0b1020 42%, #070b14 100%); color: #f4f7ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .skip-link { position: fixed; left: 1rem; top: -5rem; z-index: 9999; padding: .75rem 1rem; border-radius: .65rem; background: #fff; color: #07101f; font-weight: 700; }
      .skip-link:focus { top: 1rem; }
      .boot-shell { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
      .boot-card { width: min(32rem, 100%); padding: 2.2rem; border: 1px solid rgba(255,255,255,.14); border-radius: 1.4rem; background: rgba(10,16,31,.78); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.35); backdrop-filter: blur(16px); }
      .boot-mark { width: 4rem; height: 4rem; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(118,214,255,.55); box-shadow: 0 0 2rem rgba(77,205,255,.22); color: #86e0ff; font-size: 1.45rem; font-weight: 800; }
      .boot-card h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -.05em; }
      .boot-card p { margin: .8rem 0 0; color: #aebad5; line-height: 1.6; }
      .boot-progress { width: 9rem; height: .22rem; margin: 1.5rem auto 0; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.1); }
      .boot-progress::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #77dcff; animation: boot 1.15s ease-in-out infinite alternate; }
      @keyframes boot { from { transform: translateX(-15%); } to { transform: translateX(140%); } }
      @media (prefers-reduced-motion: reduce) { .boot-progress::after { animation: none; width: 100%; opacity: .65; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game-board">Skip to game board</a>
    <div id="app">
      <main class="boot-shell" aria-live="polite">
        <section class="boot-card">
          <div class="boot-mark" aria-hidden="true">5</div>
          <h1>Fluxquint™</h1>
          <p>Preparing the magnetic lattice…</p>
          <div class="boot-progress" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <noscript>Fluxquint™ requires JavaScript to run.</noscript>
    <script type="module" src="./src/main.js?v=1.1.1"></script>
  </body>
</html>
